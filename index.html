<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>effct — Cinematic camera filters for iOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --border: #222;
            --text: #f5e642;
            --text-muted: #9a9680;
            --accent: #e8e8e8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .grain {
            position: fixed;
            inset: 0;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px;
        }

        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 60px 24px;
            position: relative;
            text-align: center;
        }

        .hero {
            max-width: 560px;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .logo a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }

        .tagline {
            font-size: 1.15rem;
            color: var(--text);
            margin-bottom: 12px;
            letter-spacing: -0.01em;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 48px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
        }

        .features {
            display: flex;
            gap: 32px;
            justify-content: center;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }

        .feature {
            text-align: center;
        }

        .feature-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }

        .feature-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 4px;
        }

        .app-store-btn {
            display: inline-block;
            transition: opacity 0.2s, transform 0.2s;
            margin-bottom: 48px;
        }

        .app-store-btn:hover {
            opacity: 0.85;
            transform: scale(1.03);
        }

        .app-store-btn img {
            height: 54px;
        }

        .highlights {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            margin: 0 auto 56px;
        }

        .highlight {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: left;
        }

        .highlight-dot {
            width: 6px;
            height: 6px;
            background: var(--text);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .footer {
            padding-top: 32px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 24px;
            justify-content: center;
            font-size: 0.75rem;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover { color: var(--accent); }

        .copyright {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-top: 16px;
        }

        @media (max-width: 480px) {
            .logo { font-size: 2.5rem; }
            .tagline { font-size: 1rem; }
            .features { gap: 24px; }
            .page { padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <div class="grain"></div>
    <div class="page">
        <div class="hero">

            <div class="logo"><a href="index.html">EFFCT.</a></div>
            <p class="tagline">Cinematic camera filters</p>
            <p class="subtitle">
                Filters inspired by eras and moods.
            </p>

            <div class="features">
                <div class="feature">
                    <div class="feature-number">+20</div>
                    <div class="feature-label">Filters</div>
                </div>
                <div class="feature">
                    <div class="feature-number">2</div>
                    <div class="feature-label">Collections</div>
                </div>
            </div>

            <!-- CAMBIA ESTE ENLACE POR TU URL REAL DEL APP STORE -->
            <a href="https://apps.apple.com/app/effct/idXXXXXXXXXX" class="app-store-btn" aria-label="Download on the App Store">
                <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
            </a>

            <div class="highlights">
                <div class="highlight">
                    <div class="highlight-dot"></div>
                    <span>Photo & video with multi-lens zoom</span>
                </div>
                <div class="highlight">
                    <div class="highlight-dot"></div>
                    <span>Non-destructive, change filters anytime</span>
                </div>
                <div class="highlight">
                    <div class="highlight-dot"></div>
                    <span>No accounts, no servers, no tracking</span>
                </div>
                <div class="highlight">
                    <div class="highlight-dot"></div>
                    <span>Designed especially for iPhone</span>
                </div>
            </div>

            <div class="footer">
                <a href="support.html">Support</a>
                <a href="updates.html">Updates</a>
                <a href="privacy.html">Privacy</a>
                <a href="terms.html">Terms</a>
            </div>

            <p class="copyright">effct.</p>
        </div>
    </div>
</body>
</html>
